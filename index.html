<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Study</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" class="app-shell">
    <div class="progress-wrap" aria-label="Study progress">
      <div class="progress-meta">
        <span id="progress-label">Study</span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
    </div>
    <section id="screen" class="card" aria-live="polite"></section>
  </main>

  <noscript><div class="noscript">This study requires JavaScript to be enabled.</div></noscript>

  <script src="data.js"></script>
  <script src="randomization.js"></script>
  <script src="app.js"></script>
</body>
</html>
